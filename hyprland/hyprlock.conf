# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/rael-arch/Downloads/dresdenmoonlight.jpeg
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(30, 30, 46, 0.7)
    outer_color = rgba(137, 180, 250, 0.93)
    check_color = rgba(166, 227, 161, 0.93)
    fail_color = rgba(243, 139, 168, 0.93)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = <i>Senha...</i>
    fail_text = <i>$PAMFAIL</i>
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 70
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}
